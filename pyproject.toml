[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextgc"
version = "0.4.0"
description = "Deterministic context compiler for AI agent transcripts. Retires superseded facts, compacts tool output, pins declared invariants. No dependencies, no model calls."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jay Gopal Tripathy" }]
keywords = [
    "llm", "context-engineering", "context-management", "agents",
    "token-reduction", "prompt-compaction", "kv-cache", "deterministic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.0"]
dev = ["pytest>=8.0", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.27"]
# The benchmark harness is an optional extra: the library itself stays dependency-free.
bench = ["pandas>=2.0", "pyarrow>=15.0"]

[project.urls]
Homepage = "https://context-hackdevengers.vercel.app"
Repository = "https://github.com/j4yop/context-hackdevengers"
Issues = "https://github.com/j4yop/context-hackdevengers/issues"

[tool.setuptools]
packages = ["contextgc", "benchmarks"]

[tool.setuptools.package-data]
contextgc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# UP (pyupgrade) is deliberately off: it would rewrite typing.List -> list, which
# breaks the declared >=3.9 floor at runtime for anything pydantic evaluates.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
