[project]
name = "context-hackdevengers"
version = "2.0.0"
description = "ContextGC: Autonomous Semantic Context Defragmenter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
]

[tool.vercel]
entrypoint = "server.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

