name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Lint
        run: |
          pip install ruff
          ruff check .

  benchmark:
    # Guards the two measurements that are bugs when non-zero. Runs on a small
    # vendored corpus so CI needs no network and no 200 MB download. The step
    # used to be named "regress on a precision regression" while only writing a
    # JSON file, which cannot fail; --check is what makes it able to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,bench]"
      - name: Retirement must not orphan a live fact; context must not grow
        run: |
          python -m benchmarks run \
            --corpus synthetic \
            --corpus-path benchmarks/corpus/sample.txt \
            --schema benchmarks/schemas/coding.json \
            --check \
            --json /tmp/bench.json
      - name: Report
        if: always()
        run: cat /tmp/bench.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - name: The wheel must actually install and import
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import contextgc; assert contextgc.__version__"
