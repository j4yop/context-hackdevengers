name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Lint
        run: |
          pip install ruff
          ruff check .

  benchmark:
    # Fails if the measured numbers regress. Runs on a small vendored corpus so
    # CI needs no network and no 85 MB download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,bench]"
      - name: Regress on a precision regression
        run: |
          python -m benchmarks run \
            --corpus synthetic \
            --corpus-path benchmarks/corpus/sample.txt \
            --schema benchmarks/schemas/logistics.json \
            --json /tmp/bench.json
      - name: Show the report
        run: cat /tmp/bench.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - name: The wheel must actually install and import
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import contextgc; assert contextgc.__version__"
