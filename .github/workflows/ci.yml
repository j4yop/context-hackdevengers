name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Lint
        run: |
          pip install ruff
          ruff check .

  benchmark:
    # Guards the two measurements that are bugs when non-zero. Runs on a small
    # vendored corpus so CI needs no network and no 200 MB download. The step
    # used to be named "regress on a precision regression" while only writing a
    # JSON file, which cannot fail; --check is what makes it able to.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `.[dev,bench]` was installed here and nothing in this job used any of
      # it: the command below is `benchmarks run --corpus synthetic`, which
      # imports no server and no arrow loader, and the job runs no pytest. That
      # mattered for a concrete reason -- `uvicorn` pulls in `click`, and a
      # pypi.org read timeout on `click` failed this job twice while every
      # other check passed. A job should depend on what it runs, and a
      # transient index timeout should not be able to fail a pull request.
      - name: Install
        run: |
          for attempt in 1 2 3; do
            pip install -e . && break
            echo "pip install failed (attempt $attempt), retrying"
            sleep $((attempt * 10))
          done
      - name: Retirement must not orphan a live fact; context must not grow
        run: |
          python -m benchmarks run \
            --corpus synthetic \
            --corpus-path benchmarks/corpus/sample.txt \
            --schema contextgc/schemas/coding.json \
            --check \
            --json /tmp/bench.json
      - name: Report
        if: always()
        run: cat /tmp/bench.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build && python -m build
      - name: The wheel must actually install and import
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import contextgc; assert contextgc.__version__"

  browser:
    # The website shipped inert once: boot() had been lost, so it never fetched
    # /api/schemas and never rendered a result. A JS syntax check and a
    # handler/ID audit both passed it. Only driving the real page found it, so
    # driving the real page is what CI has to do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the browser driver
        working-directory: tests/browser
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Drive the page
        working-directory: tests/browser
        run: node page.mjs
      - name: Keep the screenshot from a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: page
          path: /tmp/opencode/site.png
          if-no-files-found: ignore
