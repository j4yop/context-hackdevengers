# Publishing.
#
# Two things have to be true before a tag publishes anything, because a release
# you cannot take back is worse than no release:
#
#   1. `twine check` passes on the built artifacts. The README's install
#      instructions used to be a plain falsehood -- it said `pip install
#      contextgc` while the project had never been published -- and a metadata
#      check is the cheapest place that kind of drift gets caught.
#   2. The artifacts install into an empty virtualenv and actually compile a
#      transcript with a shipped schema. The wheel used to contain a
#      `benchmarks` package with none of its JSON data, so it imported and then
#      could not load a schema. An import check would not have caught that.
#
# Auth is PyPI Trusted Publishing (OIDC), so there is no long-lived token in
# secrets. One-time setup is on pypi.org -> contextgc -> Publishing -> add
# "j4yop/context-hackdevengers" with workflow "release.yml". To use an API token
# instead, set the secret PYPI_API_TOKEN and it is preferred when present.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify, but do not upload"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: The tag must match the version being published
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" = "main" ]; then echo "dispatch: nothing to match"; exit 0; fi
          want=$(python -c "
          import re,pathlib
          text = pathlib.Path('pyproject.toml').read_text()
          print(re.search(r'^version = \"([^\"]+)\"', text, re.M).group(1))
          ")
          echo "tag=$tag  pyproject version=$want"
          [ "$tag" = "v$want" ] || {
            echo "::error::tag $tag does not match pyproject version $want"
            exit 1
          }

      - run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build
        run: python -m build

      - name: The metadata must be valid
        run: twine check --strict dist/*

      - name: The wheel must install clean and work with a shipped schema
        run: |
          set -euo pipefail
          python -m venv /tmp/v
          /tmp/v/bin/pip install --quiet dist/*.whl
          # Run from a directory that is not the repository, or `import
          # contextgc` would find the checkout and prove nothing.
          cd /tmp
          /tmp/v/bin/python - <<'PY'
          import contextgc
          assert "site-packages" in contextgc.__file__, contextgc.__file__
          names = contextgc.list_schemas()
          assert names, "the wheel ships no schemas, so state tracking is unreachable"
          print("schemas:", names)
          schema = contextgc.load_schema("coding")
          _, telemetry = contextgc.compile_messages(
              [{"role": "user", "content": "fix it"},
               {"role": "assistant", "content": "I should be editing `a/b.py`."}],
              schema=schema,
          )
          assert telemetry["active_state_slots"], "a shipped schema extracted nothing"
          print("compiled with a shipped schema:", telemetry["active_state_slots"])
          PY

      - name: The library must still have no runtime dependencies
        run: |
          /tmp/v/bin/pip list --format=freeze | grep -v '^pip==' | grep -v '^setuptools=='

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      # Trusted Publishing mints an OIDC token; no id-token for a dry run.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Would this overwrite an existing release?
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if curl -sSf -o /dev/null "https://pypi.org/pypi/contextgc/$version/json" 2>/dev/null; then
            echo "::error::contextgc $version is already on PyPI; bump the version instead"
            exit 1
          fi
          echo "contextgc $version is free"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
